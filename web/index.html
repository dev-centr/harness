<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Harness desk</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<!--
  UX contract (discussion vs work):
  1. Main chat panel — discussion cadence only (coordinator + discussion nodes).
     User Q&A lives here; worker tool noise must NOT appear as chat lines.
  2. Workers panel — task tiles (status + live summary mailbox). Full worker
     transcript only in the fork panel on drill-in.
  3. Temporal scrubber — cross-cutting; available in every view mode (not a 4th mode).
  4. Plan-queue panel — cross-cutting speculative wait stack (plan-stack daemon); not a 4th mode.
  5. View modes: Linear | Grid | Tree (shell toggle).
-->
<body data-view="linear">
  <header class="shell-bar">
    <div class="shell-identity">
      <span class="shell-label">Harness</span>
      <strong id="run-chip">coordinator</strong>
    </div>
    <div class="shell-controls">
      <div class="view-mode" role="group" aria-label="View mode">
        <button type="button" class="view-mode-btn is-active" data-view="linear">Linear</button>
        <button type="button" class="view-mode-btn" data-view="grid">Grid</button>
        <button type="button" class="view-mode-btn" data-view="tree">Tree</button>
      </div>
      <button type="button" id="btn-spawn-task" class="epoch-btn">Spawn task</button>
    </div>
  </header>

  <div class="desk-shell">
    <!-- Linear: sidebar of discussion nodes (not tasks) -->
    <nav class="discussion-nav" id="discussion-nav" aria-label="Discussion threads">
      <span class="panel-label">Discussion</span>
      <ul class="discussion-list" id="discussion-list"></ul>
    </nav>

    <div class="desk-main">
      <!-- Discussion cadence — real chat from /api/nodes/{id}/chat; never worker transcripts -->
      <section class="discussion-panel" aria-label="Main discussion">
        <div class="chat-header">
          <span class="chat-title" id="chat-title">Coordinator</span>
          <span class="chat-meta" id="thread-meta">Discussion cadence</span>
        </div>
        <ol class="chat-lines" id="main-lines" aria-live="polite"></ol>
        <form class="main-compose" id="main-compose">
          <input type="text" id="main-input" placeholder="Message coordinator…" autocomplete="off" />
          <button type="submit">Send</button>
        </form>
      </section>

      <!-- Work cadence — task mailbox; full transcript only in fork panel -->
      <section class="workers-panel" id="workers-panel" aria-label="Workers">
        <div class="workers-header">
          <span class="panel-label">Workers</span>
          <span class="workers-meta" id="workers-meta"></span>
        </div>
        <div class="workers-grid" id="workers-grid" role="list"></div>
      </section>

      <!-- Tree mode replaces workers grid with spawn/dependency canvas -->
      <section class="tree-panel" id="tree-panel" aria-label="Spawn tree" hidden>
        <div class="tree-header">
          <span class="panel-label">Spawn tree</span>
          <span class="tree-meta" id="tree-meta">Click a node to open fork · + spawns a child</span>
        </div>
        <div class="tree-scroll">
          <svg class="tree-edges" id="tree-edges" aria-hidden="true"></svg>
          <div class="tree-columns" id="tree-columns"></div>
        </div>
      </section>
    </div>
  </div>

  <!-- Drill-in: full transcript for any selected node (task or discussion) -->
  <aside class="fork-panel is-hidden" id="fork-panel" aria-label="Node fork chat">
    <div class="fork-header">
      <button type="button" id="fork-close" class="fork-close" aria-label="Close fork">×</button>
      <div>
        <strong id="fork-title">Node</strong>
        <span class="fork-meta" id="fork-status"></span>
      </div>
      <div class="fork-actions">
        <button type="button" id="btn-mark-complete" class="fork-action">Mark completed</button>
        <button type="button" id="btn-archive" class="fork-action">Archive</button>
      </div>
    </div>
    <ol class="fork-lines" id="fork-lines"></ol>
    <form class="fork-compose" id="fork-compose">
      <input type="text" id="fork-input" placeholder="Message this node…" autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </aside>

  <!-- Speculative plan queue — cross-cutting; proxies plan-stack (not a view mode) -->
  <section class="plan-queue-panel" id="plan-queue-panel" aria-label="Speculative plan queue">
    <div class="plan-queue-header">
      <span>Plan stack</span>
      <span class="plan-queue-meta" id="plan-queue-meta">plan-stackd…</span>
    </div>
    <div class="plan-queue-columns" id="plan-queue-columns"></div>
  </section>

  <!-- Temporal scrubber — global or subtree scope; present in all view modes -->
  <section class="temporal-panel" id="temporal-panel" aria-label="Timeline">
    <div class="temporal-header">
      <span>Timeline</span>
      <select id="timeline-scope">
        <option value="global">Global</option>
      </select>
      <input type="range" id="timeline-zoom" min="0.5" max="3" step="0.1" value="1" title="Zoom" />
    </div>
    <canvas id="timeline-heatmap" height="48"></canvas>
    <input type="range" id="timeline-scrub" min="0" max="100" value="100" class="timeline-scrub" />
    <ul class="timeline-bookmarks" id="timeline-bookmarks"></ul>
  </section>

  <p class="status-strip" id="status-strip" role="status">Linear — discussion in center, tasks in workers strip.</p>

  <script src="/static/app.js" type="module"></script>
</body>
</html>
